name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    # Catches an advisory published *after* a dependency was already approved and merged --
    # the path-filtered triggers above only re-check when Cargo.lock itself changes, so a new
    # RustSec disclosure against an unchanged lockfile would otherwise go unnoticed until the
    # next dependency bump.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      # Only the scheduled run files an issue per new advisory (see rustsec/audit-check's own
      # docs); push/pull_request runs just fail the check, matching every other job in ci.yml.
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: cargo audit (RustSec advisory database)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
