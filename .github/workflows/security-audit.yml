name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    # Catches an advisory published *after* a dependency was already approved and merged --
    # the path-filtered triggers above only re-check when Cargo.lock itself changes, so a new
    # RustSec disclosure against an unchanged lockfile would otherwise go unnoticed until the
    # next dependency bump.
    - cron: "17 6 * * 1"
  workflow_dispatch: {} # manual on-demand run, and how this workflow was first verified end-to-end

permissions:
  contents: read

jobs:
  # Two jobs, not one shared by every trigger: `permissions:` is per-job, so a single job
  # covering push/pull_request/schedule would hand `issues: write` to every push and PR run too,
  # even though only the scheduled run ever files an issue (rustsec/audit-check's own behavior).
  # Same-repo pull requests get a write-capable GITHUB_TOKEN by default (only fork PRs are
  # downgraded to read-only automatically), so this isn't a theoretical distinction.
  audit-on-change:
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Dependabot runs get a read-only GITHUB_TOKEN whatever `permissions:` says, and
      # rustsec/audit-check reports through a check run it has to create and update. With the one
      # standing warning (a yanked `chacha20`, which has no advisory ID and so cannot be put in
      # .cargo/audit.toml) that update returns 404 and the job fails even though cargo audit found
      # nothing ("No vulnerabilities were found" then "Not Found - update-a-check-run", seen on PRs
      # #143/#144). For Dependabot the job therefore runs `cargo audit` itself: same database, same
      # .cargo/audit.toml, a non-zero exit on a real vulnerability, no check run to create.
      # The restriction follows the pull request, not whoever pressed the button: a Dependabot PR
      # whose branch was updated by a person (`gh pr update-branch`) still got the read-only token
      # and the same 404, so the condition also looks at the head branch name.
      - name: "cargo audit (Dependabot - plain run, no check run)"
        if: github.actor == 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/')
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: cargo audit (RustSec advisory database)
        if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  audit-scheduled:
    timeout-minutes: 15
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: cargo audit (RustSec advisory database)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
