name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (notify-server feature)
        run: cargo clippy --all-targets --features notify-server -- -D warnings

      - name: cargo test (default features)
        run: cargo test --all-targets

      - name: cargo test (notify-server feature)
        run: cargo test --all-targets --features notify-server

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install okf
        # Pinned deliberately: the docs gate compares generated indexes byte-for-byte, so an
        # unpinned `cargo install` lets any upstream okf release fail an unrelated PR. That is
        # not hypothetical -- okf 0.2.2 started escaping `&` in link titles and broke the gate
        # on a PR that touched neither AGENTS.md nor CLAUDE.md. Bump this deliberately, with the
        # regenerated indexes in the same commit.
        run: cargo install okf --version 0.2.2 --locked

      - name: Check the OKF documentation bundle (AGENTS.md rule 15)
        # Every gate lives in scripts/okf-docs.sh so the tracked-docs list has exactly one
        # definition and developers run locally what CI runs. Covers: no untracked root
        # .md file, okf parse per doc, okf validate + lint on the staged bundle, and that
        # the committed index.md files match what `okf index` generates right now.
        run: bash scripts/okf-docs.sh check
