name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least privilege, matching security-audit.yml. Nothing in this workflow writes: it tests,
# lints, builds docs and checks the docs bundle.
permissions:
  contents: read

# A second push to the same branch makes the first run's result irrelevant, so cancel it
# rather than letting both queue to completion. `main` is excluded from cancellation: a
# push there is a merge whose result is worth recording even if another lands right after.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # A hung job otherwise burns the 6-hour default. Not hypothetical for this project:
    # stdout/stderr pipe deadlock is one of the failure modes rustcopy exists to solve.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # No --locked here, unlike every other cargo command below: `cargo fmt` does no
      # dependency resolution and rejects the flag with "unexpected argument".
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        run: cargo clippy --locked --workspace --exclude rustcopy-gui --all-targets -- -D warnings

      - name: cargo clippy (notify-server feature)
        run: cargo clippy --locked --workspace --exclude rustcopy-gui --all-targets --features rustcopy-cli/notify-server -- -D warnings

      # clippy::unwrap_used/expect_used are allow-by-default "restriction" lints, so `-D warnings`
      # alone never catches a new unwrap()/expect() — they have to be turned on explicitly first
      # (order matters: -D warnings promotes whatever is at warn-level *at that point*, so the -W
      # flags must come before it). Deliberately `--lib --bins`, not `--all-targets`/the two steps
      # above: test code legitimately unwraps everywhere (that's idiomatic, not a defect), and
      # linting it here was tried first — it hit ~560 pre-existing call sites in the test suite
      # alone. Scoping to production code only is what makes this gate about the 24 real call
      # sites (each carrying its own #[allow(...)] with a one-line reason) instead of the whole
      # test suite. Every crate needs its own line: `-p` here (unlike `--workspace` above) doesn't
      # merge, and rustcopy-gui has no lib target, hence `--bins` alone for it below.
      - name: cargo clippy (unwrap/expect discipline, production code only)
        run: |
          cargo clippy --locked -p rustcopy-core --lib --bins -- -W clippy::unwrap_used -W clippy::expect_used -D warnings
          cargo clippy --locked -p rustcopy-cli --bins -- -W clippy::unwrap_used -W clippy::expect_used -D warnings
          cargo clippy --locked -p rustcopy-cli --bins --features notify-server -- -W clippy::unwrap_used -W clippy::expect_used -D warnings

      - name: cargo test (default features)
        run: cargo test --locked --workspace --exclude rustcopy-gui --all-targets

      - name: cargo test (notify-server feature)
        run: cargo test --locked --workspace --exclude rustcopy-gui --all-targets --features rustcopy-cli/notify-server

      # Broken intra-doc links are invisible to clippy and to the test suite, and this crate
      # leans on them heavily (17 in generations.rs alone). Adding this gate immediately
      # surfaced 10 real defects, including a public doc pointing at a test-only type and a
      # bare `<dest>` that rustdoc was parsing as an HTML tag.
      - name: cargo doc (no broken intra-doc links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          # Per package, not --workspace: the lib target `robocopy_ingest` (rustcopy-core) and the
          # bin target of the same name (rustcopy-cli) write to the same doc path, so one run over
          # both emits a cargo output-collision warning and one output overwrites the other
          # (rust-lang/cargo#6313). Split, each is checked and neither clobbers the other.
          cargo doc --locked -p rustcopy-core --no-deps --all-features
          cargo doc --locked -p rustcopy-cli --no-deps --all-features

      # AGENTS.md rule 8: axum must never reach the default build. The rule already existed
      # but was enforced only by whoever remembered to run `cargo tree` before committing --
      # a transitive dependency could pull axum into the backup binary unnoticed.
      - name: axum stays behind the notify-server feature (AGENTS.md rule 8)
        shell: bash
        run: |
          if cargo tree --locked -p rustcopy-cli | grep -qi axum; then
            echo "::error::axum reached the default build — it must stay behind --features notify-server"
            cargo tree --locked -p rustcopy-cli | grep -i axum
            exit 1
          fi
          cargo tree --locked -p rustcopy-cli --features rustcopy-cli/notify-server | grep -qi axum    || { echo "::error::axum missing even with --features notify-server"; exit 1; }

      # F52: the GUI (milestone 7.0.0) will be a workspace member with an npm/vite toolchain. The
      # CLI must never acquire a dependency on it -- that is what keeps a scheduled, unattended
      # backup running exactly the same code whether or not the GUI is installed
      # (PIANO_GUI_TAURI.md §2.1). Same shape as the axum gate above: `if`, never
      # `... | grep -q … && exit 1`, which returns 1 when grep finds nothing and would fail the
      # job precisely when the tree is clean.
      - name: the CLI never depends on the GUI toolchain (PIANO_GUI_TAURI.md §4.2)
        shell: bash
        run: |
          if cargo tree --locked -p rustcopy-cli | grep -qiE 'tauri|wry|tao'; then
            echo "::error::a GUI dependency reached the CLI binary -- it must stay in rustcopy-gui"
            cargo tree --locked -p rustcopy-cli | grep -iE 'tauri|wry|tao'
            exit 1
          fi

  # Keeps Cargo.toml's rust-version honest. It was declared as 1.74 for months while nothing
  # ever tested it, and it was wrong by fourteen releases: the committed lockfile pulls
  # time@0.3.54, which needs 1.88. Checked against --locked, so the gate tracks the lockfile
  # the project actually ships rather than whatever resolves on the day.
  msrv:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check on MSRV (both feature sets)
        run: |
          cargo check --workspace --exclude rustcopy-gui --all-targets --locked
          cargo check --workspace --exclude rustcopy-gui --all-targets --locked --features rustcopy-cli/notify-server

  # F53: the GUI is Windows-native and depends on Tauri, which needs webkit2gtk system libraries
  # on Linux — so it is excluded from the cross-platform jobs above and checked here instead. That
  # is not a gap: the product ships on Windows, and building the console on a platform it never
  # runs on would prove nothing while making every other job slower.
  #
  # `cargo check` needs no frontend build: verified that tauri-build succeeds with `ui/dist`
  # absent, so this job needs no Node at all. A release bundle does need it, but that is F60.
  gui:
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # The frontend is now a build-time requirement, not a packaging step. `custom-protocol` is
      # on by default (it is what makes a release build serve the embedded assets instead of the
      # dev server), and tauri-build refuses to compile when `frontendDist` is missing. This job
      # used to skip Node precisely because the check passed without it -- which is how it came to
      # certify a configuration nobody ships. It now compiles what ships.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/rustcopy-gui/ui/package-lock.json

      - name: Build the frontend the crate embeds
        working-directory: crates/rustcopy-gui/ui
        run: npm ci && npm run build

      - name: cargo check (GUI crate)
        run: cargo check --locked -p rustcopy-gui --all-targets

      - name: cargo clippy (GUI crate)
        run: cargo clippy --locked -p rustcopy-gui --all-targets -- -W clippy::unwrap_used -W clippy::expect_used -D warnings

  # PIANO_GUI_TAURI.md §8.6: the Rust dependencies have `cargo audit` in security-audit.yml; the
  # npm ones that arrived with the frontend need the equivalent. Kept in the ordinary CI rather
  # than the audit workflow because it is fast and needs no advisory-database checkout. Also
  # builds the frontend: that is what caught `index.html` being swallowed by the blanket `*.html`
  # ignore, which the local build could not see because the file was present there.
  gui-npm-audit:
    # Bumped from 10 (4 Set 2026): `npm ci` alone was consistently taking 7-8 minutes even with a
    # warm cache hit, leaving `npm audit`/`npm run build` no room before the job hit the old limit
    # and GitHub cancelled it mid-step ("The operation was canceled") — reproduced identically on 4
    # consecutive runs, unrelated to any change in this repo's own npm files. If this starts timing
    # out again, the registry/network got slower still — check actual step durations before bumping
    # further rather than assuming the same cause.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/rustcopy-gui/ui/package-lock.json

      - name: npm ci
        working-directory: crates/rustcopy-gui/ui
        run: npm ci

      - name: npm audit
        working-directory: crates/rustcopy-gui/ui
        run: npm audit --audit-level=moderate

      - name: the frontend builds
        working-directory: crates/rustcopy-gui/ui
        run: npm run build

  # F60: four files declare the release version and no build step keeps them together. Its own
  # job rather than a step inside `docs`: it needs no Rust toolchain and no okf install, so it
  # reports in seconds instead of waiting behind a cargo cache restore.
  versions:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that every version declaration agrees
        run: bash scripts/check-versions.sh

  docs:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install okf
        # Pinned deliberately: the docs gate compares generated indexes byte-for-byte, so an
        # unpinned `cargo install` lets any upstream okf release fail an unrelated PR. That is
        # not hypothetical -- okf 0.2.2 started escaping `&` in link titles and broke the gate
        # on a PR that touched neither AGENTS.md nor CLAUDE.md. Bump this deliberately, with the
        # regenerated indexes in the same commit.
        run: cargo install okf --version 0.2.2 --locked

      - name: Check the OKF documentation bundle (AGENTS.md rule 15)
        # Every gate lives in scripts/okf-docs.sh so the tracked-docs list has exactly one
        # definition and developers run locally what CI runs. Covers: no untracked root
        # .md file, okf parse per doc, okf validate + lint on the staged bundle, and that
        # the committed index.md files match what `okf index` generates right now.
        run: bash scripts/okf-docs.sh check
