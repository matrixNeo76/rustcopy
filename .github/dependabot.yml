version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # `windows-core` must move together with the `windows` crate: the Shell extension's COM
      # `#[implement]` code needs both on the same windows-core. Bumped alone (PR #135, 0.62 ->
      # 0.100) the two end up as incompatible versions and the `shell` CI job stops compiling
      # (E0603/E0277). Lift this once a release of `windows` depends on the newer windows-core,
      # and bump the two by hand in one change.
      - dependency-name: "windows-core"
        versions: [">=0.63"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # `dtolnay/rust-toolchain` is pinned by *Rust toolchain version*, not by action version:
      # the `@1.89.0` in ci.yml's msrv job means "install Rust 1.89.0", and 1.89 is exactly the
      # `rust-version` declared in Cargo.toml. Dependabot reads that tag as an action version and
      # proposes bumping it (it opened #41 to move it to 1.100.0). Merging such a PR would make
      # the msrv job install a modern toolchain and check against that instead -- the job would
      # stay green while proving nothing about the declared MSRV, which is the one thing it
      # exists to prove.
      #
      # The pin must only ever change together with `rust-version` in Cargo.toml, by hand.
      - dependency-name: "dtolnay/rust-toolchain"
