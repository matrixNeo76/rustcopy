version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # `dtolnay/rust-toolchain` is pinned by *Rust toolchain version*, not by action version:
      # the `@1.88.0` in ci.yml's msrv job means "install Rust 1.88.0", and 1.88 is exactly the
      # `rust-version` declared in Cargo.toml. Dependabot reads that tag as an action version and
      # proposes bumping it (it opened #41 to move it to 1.100.0). Merging such a PR would make
      # the msrv job install a modern toolchain and check against that instead -- the job would
      # stay green while proving nothing about the declared MSRV, which is the one thing it
      # exists to prove.
      #
      # The pin must only ever change together with `rust-version` in Cargo.toml, by hand.
      - dependency-name: "dtolnay/rust-toolchain"
