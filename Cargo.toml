[package]
name = "robocopy_ingest"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "CLI Rust per l'ingestion di grandi volumi CSV via Robocopy, con benchmark contro copia naive"
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std", "env-filter", "time"] }
indicatif = "0.17"
sha2 = "0.10"
blake3 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tempfile = "3"
toml = "0.8"
num_cpus = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
