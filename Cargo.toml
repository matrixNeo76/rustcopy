# F52: workspace, so the Tauri GUI (milestone 7.0.0) can be a member without dragging an npm/vite
# toolchain into the CLI's crate. `notify-server` stays a feature-gated binary because it is pure
# Rust; a GUI would not be (see ROADMAP.md F52 and PIANO_GUI_TAURI.md §4.3).
#
# Package names are new; **the library and binary names are deliberately unchanged**
# (`robocopy_ingest`, `notify-server`). That keeps every `use robocopy_ingest::…` in the sources,
# every test import, `installer/rustcopy.iss` and the PowerShell scripts working untouched -- this
# commit restructures, it does not rename anything a user or a script can see.
[workspace]
resolver = "2"
members = ["crates/rustcopy-core", "crates/rustcopy-cli"]

# Single definition of every dependency version, inherited by the members with
# `workspace = true`. Without this, two members could drift onto different versions of the same
# crate and `--locked` would stop being the guarantee the CI relies on.
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std", "env-filter", "time"] }
indicatif = "0.18"
sha2 = "0.11"
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tempfile = "3"
toml = "1.1"
num_cpus = "1"
aes-gcm = { version = "0.11", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
axum = { version = "0.8" }
windows-service = "0.8"

[workspace.package]
version = "6.0.0"
edition = "2021"
# Verified in CI by the `msrv` job, not asserted: 1.74 was declared here for months
# while the dependency tree had long since moved past it (time@0.3.54 requires 1.88).
# Raised to 1.89 on 31 Agosto 2026 by the aes-gcm 0.11 upgrade, which pulls aes@0.9.3 --
# the msrv job caught it, which is the whole reason that job exists. Change this only
# together with the toolchain pin in ci.yml's msrv job; they are one decision.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/matrixNeo76/rustcopy"
homepage = "https://github.com/matrixNeo76/rustcopy"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
