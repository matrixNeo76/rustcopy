[package]
name = "rustcopy-gui"
description = "Read-only desktop console for rustcopy (milestone 7.0.0, F53)"
# Not published: it is an application, and it carries an npm/vite toolchain that has no place on
# crates.io.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Tauri decides dev-vs-production from this feature, not from the cargo profile: its own build
# script computes `dev = !custom-protocol` (tauri-2.11.5/build.rs). Without it a `--release` build
# still points the WebView at `devUrl` and ships an application that shows ERR_CONNECTION_REFUSED
# on any machine where the Vite dev server is not running -- which is every machine an installer
# reaches. The Tauri CLI adds this flag itself during `tauri build`; this project builds with plain
# cargo, so it has to be declared here.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustcopy-core = { path = "../rustcopy-core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "rustcopy-gui"
path = "src/main.rs"
