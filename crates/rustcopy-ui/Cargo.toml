[package]
name = "rustcopy-ui"
description = "Slint console for rustcopy (PIANO_GUI_SLINT.md phase 2 foundations)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[dependencies]
rustcopy-core = { path = "../rustcopy-core" }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "accessibility",
    "system-tray",
    "unstable-winit-030",
] }
rfd = { version = "0.17", default-features = false }
chrono.workspace = true
# Resolves the real "Documents" folder where saved tasks go; already the effective version in the tree
# (the Tauri console declares it too).
dirs = "7"
# Named mutex and pipe for the single window. Already the effective version in the tree (see the
# workspace comment on windows-sys): only the Win32 modules this crate needs are enabled.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell"] }

# The system notification at the end of a copy (WinRT toast). Already in the tree for the Shell extension;
# only the notification, XML and runtime-initialisation features are enabled here, and the CLI never sees it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT"] }

[build-dependencies]
slint-build = "1.18"

# Embeds the executable's icon and version information (Explorer, Start menu, file properties). A
# build-time tool only: nothing of it ends up in the binary beyond the resource it writes.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "rustcopy-ui"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
