[package]
name = "rustcopy-ui"
description = "Slint console for rustcopy (PIANO_GUI_SLINT.md phase 2 foundations)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[dependencies]
rustcopy-core = { path = "../rustcopy-core" }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "accessibility",
    "system-tray",
    "unstable-winit-030",
] }
rfd = { version = "0.17", default-features = false }
# Named mutex and pipe for the single window. Already the effective version in the tree (see the
# workspace comment on windows-sys): only the Win32 modules this crate needs are enabled.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[build-dependencies]
slint-build = "1.18"

[[bin]]
name = "rustcopy-ui"
path = "src/main.rs"
