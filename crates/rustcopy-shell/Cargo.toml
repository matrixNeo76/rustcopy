[package]
name = "rustcopy-shell"
description = "Windows Shell drag-and-drop handler that offers rustcopy as an alternative to the OS copy on the drop confirmation menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "rustcopy_shell"
crate-type = ["cdylib"]

# Windows-only by construction (a Shell COM extension has no meaning off Windows), same pattern
# as rustcopy-core's own windows-service/windows-sys dependencies.
[target.'cfg(windows)'.dependencies]
rustcopy-core = { path = "../rustcopy-core" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell_Common", "Win32_Security", "Win32_System_Ole", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage"] }
windows-core = "0.62.2"

[dev-dependencies]
tempfile.workspace = true
