# Demo eseguibile — l'unico esempio di questa cartella che si lancia senza modificarlo.
#
# Gli altri quattro (`first-time-full-copy`, `scheduled-incremental`, `smb-nas-mirror`,
# `full-profile-test.local`) sono **modelli**: contengono segnaposto come `<PERCORSO_SORGENTE>`
# da sostituire con percorsi veri. Vanno letti, non eseguiti.
#
# Questo invece copia una manciata di file finti già presenti nel repo in una cartella accanto,
# quindi non può toccare nulla di tuo.
#
# Dalla console: scheda Esegui, scegli questo file, premi Avvia. Funziona da qualunque cartella
# la console sia stata avviata, perché la console imposta la directory di lavoro su quella della
# configurazione.
#
# Dalla CLI, lancia **da questa cartella**, per la stessa ragione:
#
#   cd examples
#   ../target/release/robocopy_ingest.exe --config demo-locale.toml --dry-run
#   ../target/release/robocopy_ingest.exe --config demo-locale.toml
#
# Poi apri `demo-out/report.json` nella scheda Report, oppure:
#
#   ../target/release/robocopy_ingest.exe --advise --report-path demo-out/report.json
#
# `examples/demo-out/` è escluso da git: cancellala quando vuoi, si ricrea da sola.

# Percorsi relativi **a questo file**, non alla cartella da cui lanci il comando.
#
# È la convenzione che la console impone, e la ragione è che chi sceglie un file in una finestra
# di dialogo non ha alcuna nozione della directory di lavoro di quella finestra: l'unico
# significato sensato di un percorso relativo, lì, è "rispetto al file che lo contiene".
source = "demo-data"
dest   = "demo-out/copia"

# Il pattern predefinito è `*`; qui è esplicito perché la demo serve anche a leggersi.
pattern = "*"

# Esclude il `.tmp` presente in demo-data: dopo la run, `documenti/bozza.tmp` non compare in
# destinazione, ed è così che si vede che l'esclusione ha agito invece di essere una riga di
# configurazione decorativa.
#
# Non conto i file qui di proposito: robocopy conta anche le directory che crea, mentre
# l'inventario conta solo i file, quindi il report può dire "6 / 4" per questa demo. Promettere
# un numero fisso in un commento vorrebbe dire far sembrare un errore un dato corretto.
exclude_files = ["*.tmp"]

# Riverifica i byte a destinazione confrontando gli hash: su cinque file costa nulla, e fa sì
# che la scheda Report abbia qualcosa da mostrare oltre ai totali.
verify_integrity = true

# Report e log accanto alla copia, non dentro: l'indice dello storico vive di fianco al report,
# e scrivere dentro la destinazione ne cambierebbe la data facendo ricopiare file immutati alla
# run successiva.
report_path = "demo-out/report.json"
log_path    = "demo-out/ingest.log"

# Deliberatamente **non** mirror: nessun esempio avviabile deve poter cancellare qualcosa.
# Per vedere come si comporta `mirror`, leggi `smb-nas-mirror.toml` — che infatti non è avviabile.
